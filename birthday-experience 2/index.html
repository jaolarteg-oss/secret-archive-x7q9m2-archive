<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Trazia | Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Only a neutral work login appears before the surprise. No credentials are collected. -->
  <main id="login" class="login" aria-label="Sign in">
    <header class="login-brand"><span class="brand-symbol" aria-hidden="true"></span><span>trazia</span></header>
    <form id="loginForm" class="login-form">
      <h1>Sign in</h1>
      <label for="workEmail">Email address</label>
      <input id="workEmail" value="reviewer@demo.local" readonly autocomplete="off">
      <label for="workPassword">Password</label>
      <input id="workPassword" type="password" value="demopassword" readonly autocomplete="off">
      <button class="signin" id="loginButton" type="submit">Sign in <span aria-hidden="true">→</span></button>
    </form>
  </main>

  <div id="blackout" class="blackout" aria-hidden="true"><div class="ring"></div><div class="ring"></div><div class="ring"></div></div>

  <main id="story" class="story" aria-hidden="true">
    <button type="button" class="sound-control" id="soundControl" aria-label="Toggle music" aria-pressed="false" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6l-5 4H4Z"/><path d="M17 9c2 2 2 4 0 6"/></svg></button>
    <div class="night-sky" aria-hidden="true">
      <span class="twinkle t1"></span><span class="twinkle t2"></span><span class="twinkle t3"></span><span class="twinkle t4"></span><span class="twinkle t5"></span><span class="twinkle t6"></span><span class="twinkle t7"></span><span class="twinkle t8"></span>
      <span class="glow g1"></span><span class="glow g2"></span><span class="glow g3"></span>
      <span class="shooting sh1"></span><span class="shooting sh2"></span><span class="shooting sh3"></span>
    </div>

    <section class="stage active" id="stage0" data-stage="0" aria-label="First message">
      <div class="memory-field" data-gallery-stage="0" aria-hidden="true"></div>
      <div class="slots" aria-hidden="true">
        <div class="slot photo top-left" data-photo="0"></div>
        <div class="slot sticker right-high" data-sticker="0"></div>
        <div class="slot photo bottom-right" data-photo="1"></div>
      </div>
      <div class="stage-center"><p class="message" id="message0">This was never about work.</p><button class="next" id="next0" type="button" aria-label="Continue"><span aria-hidden="true">→</span></button></div>
    </section>

    <section class="stage" id="stage1" data-stage="1" aria-label="A little interaction">
      <div class="memory-field" data-gallery-stage="1" aria-hidden="true"></div>
      <div class="slots" aria-hidden="true"><div class="slot photo top-right" data-photo="2"></div><div class="slot sticker left-low" data-sticker="1"></div></div>
      <div class="stage-center"><p class="message" id="message1">Some things just belong together.</p>
        <div class="move-puzzle" id="puzzle"><button id="dot" class="move-dot" type="button" aria-label="Drag the white dot to the empty circle, or tap it and then the circle" aria-pressed="false"></button><span class="puzzle-line" aria-hidden="true"></span><button id="destination" class="move-target" type="button" aria-label="Place the dot inside the circle"></button></div>
        <button class="next" id="next1" type="button" aria-label="Continue" hidden><span aria-hidden="true">→</span></button>
      </div>
    </section>

    <section class="stage" id="stage2" data-stage="2" aria-label="A message in both directions">
      <div class="memory-field" data-gallery-stage="2" aria-hidden="true"></div>
      <div class="scroll-area" id="scrollArea" tabindex="0" aria-label="Scroll down, then scroll back up to uncover different messages">
        <div class="scroll-track">
          <div class="scroll-panel scroll-panel-first" id="scrollFirstPanel">
            <div class="slots" aria-hidden="true"><div class="slot photo top-left" data-photo="3"></div><div class="slot sticker right-high" data-sticker="2"></div></div>
            <div class="stage-center"><p class="message" id="scrollMessage">I love every little moment with you.</p><div class="scroll-cue" id="scrollCue" aria-hidden="true">↓</div><button class="next" id="next2" type="button" aria-label="Continue" hidden><span aria-hidden="true">→</span></button></div>
          </div>
          <div class="scroll-panel scroll-panel-return" id="scrollReturnPanel" aria-hidden="true">
            <div class="slots" aria-hidden="true"><div class="slot photo top-left" data-photo="3"></div><div class="slot sticker right-high" data-sticker="2"></div></div>
            <div class="stage-center"><p class="message" id="scrollDownMessage">I wish I could keep every moment forever.</p><div class="scroll-cue up" aria-hidden="true">↑</div></div>
          </div>
        </div>
      </div>
      <div class="scroll-blackout" id="scrollBlackout" aria-hidden="true"></div>
    </section>

    <section class="stage" id="stage3" data-stage="3" aria-label="A memory in the dark">
      <div class="memory-field" data-gallery-stage="3" aria-hidden="true"></div>
      <div class="slots" aria-hidden="true"><div class="slot sticker left-high" data-sticker="3"></div><div class="slot photo bottom-left" data-photo="4"></div></div>
      <div class="photo-from-dark" id="photoReveal" aria-hidden="true"><div class="photo-reveal-slot" data-photo="5"></div></div>
      <div class="stage-center photo-stage-center"><p class="message" id="message3">Some memories are worth holding onto.</p><button class="hold" id="holdButton" type="button" aria-label="Press and hold the white circle until the ring completes. On keyboard, hold Space or Enter."><span class="hold-outline" aria-hidden="true"></span><span class="hold-core" aria-hidden="true"></span></button><button class="next" id="next3" type="button" aria-label="Continue" hidden><span aria-hidden="true">→</span></button></div>
      <div class="hold-explosion" id="holdExplosion" aria-hidden="true"><canvas id="fireworkCanvas"></canvas><div class="explosion-black"></div></div>
    </section>

    <section class="stage" id="stage4" data-stage="4" aria-label="Three hidden notes">
      <div class="memory-field" data-gallery-stage="4" aria-hidden="true"></div>
      <div class="slots" aria-hidden="true"><div class="slot photo top-left" data-photo="6"></div><div class="slot photo bottom-right" data-photo="7"></div></div>
      <div class="stage-center"><p class="message" id="notesMessage">There are so many reasons I love you.</p><div class="note-slots">
        <button class="note-slot" type="button" data-note="0" aria-label="Reveal the first note"><span class="slot-cross" aria-hidden="true"></span></button>
        <button class="note-slot" type="button" data-note="1" aria-label="Reveal the second note"><span class="slot-cross" aria-hidden="true"></span></button>
        <button class="note-slot" type="button" data-note="2" aria-label="Reveal the third note"><span class="slot-cross" aria-hidden="true"></span></button>
      </div><button class="next" id="next4" type="button" aria-label="Continue" hidden><span aria-hidden="true">→</span></button></div>
    </section>

    <section class="stage" id="stage5" data-stage="5" aria-label="Birthday message">
      <div class="memory-field" data-gallery-stage="5" aria-hidden="true"></div>
      <div class="slots" aria-hidden="true"><div class="slot photo top-left" data-photo="8"></div><div class="slot sticker left-low" data-sticker="4"></div><div class="slot photo bottom-right" data-photo="9"></div><div class="slot sticker right-high" data-sticker="5"></div></div>
      <div class="bokeh-burst" id="bokehBurst" aria-hidden="true"></div><div class="stage-center"><p class="message" id="finalMessage">I have one last thing to say.</p><button class="next" id="finishButton" type="button" aria-label="Open the final message"><span aria-hidden="true">→</span></button>
        <button class="gift-button" id="giftButton" type="button" aria-label="Open your birthday gift" hidden>
          <svg class="gift-symbol" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M14 32H58V59H14V32ZM11 25H61V33H11V25ZM36 25V59" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M36 25C29 25 21 22 21 17C21 11 28 11 32 15C35 18 36 25 36 25ZM36 25C43 25 51 22 51 17C51 11 44 11 40 15C37 18 36 25 36 25Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
          </svg>
        </button></div>
    </section>
  </main>
  <div class="video-overlay" id="videoOverlay" role="dialog" aria-modal="true" aria-label="Your birthday gift" hidden>
    <button class="video-close" id="videoClose" type="button" aria-label="Close birthday video"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M5 5L19 19M19 5L5 19"/></svg></button>
    <video id="birthdayVideo" class="birthday-video" playsinline controls preload="metadata" aria-label="Birthday video"><source src="assets/birthday-surprise-video.mp4" type="video/mp4"></video>
  </div>
  <audio id="backgroundMusic" preload="none" loop></audio>
  <script src="content.js"></script>
  <script src="script.js"></script>
</body>
</html>
